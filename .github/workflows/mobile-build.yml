# Builds the Expo app and publishes the installables to a GitHub Release.
# Copied from Two-way-audio-streamer/.github/workflows/mobile-build.yml. Comments starting with
# "CHANGED:" mark where this project differs from that one, and why.
#
#   Android: release APK from the android/ project generated by `expo prebuild` (signed with the
#            stock Expo debug keystore, so it installs over local builds). arm64-v8a + x86_64
#            only, see app.config.js.
#   iOS:     UNSIGNED .ipa. iOS won't install it as-is; re-sign it with Sideloadly / AltStore
#            using an Apple ID.
#
# Triggers:
#   - push to master                          -> pre-release "build-<run number>"
#   - push a tag like v1.0.1                  -> release named after the tag
#   - Actions tab -> "Mobile builds" -> Run workflow (any branch; iOS optional)
#
# macOS runners bill at 10x on private repos, so the iOS job is the expensive one.

name: Mobile builds

on:
  push:
    # CHANGED: this repo's default branch is master, not main.
    branches: [master]
    tags: ['v*']
    # CHANGED: the app lives at the repo root here (not in app/), so build on any change except
    # docs and the local build helper scripts.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'build-android.sh'
      - 'wait_and_convert.sh'
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the unsigned iOS IPA (macOS minutes bill at 10x)
        type: boolean
        default: true

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  EXPO_NO_TELEMETRY: 1

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    # CHANGED: 60 -> 240 minutes. llama.rn compiles llama.cpp from source on Android, once per
    # CPU variant (7 for arm64-v8a, 2 for x86_64); that's the ~1h build on a fast PC, and GitHub's
    # runners for private repos are smaller (the first run was still building after 1h36m).
    # Jobs can run up to 6h, so this won't hit an EAS-style cutoff.
    timeout-minutes: 240
    steps:
      # CHANGED: new step. The first run died ~1.5h in with "No space left on device": each of the
      # 9 llama.cpp builds keeps its own object files plus several copies of the libraries, and
      # the runner's disk is mostly taken by preinstalled toolchains. This deletes the ones this
      # job never uses (.NET, Haskell, CodeQL, Swift, ...). Android SDK, Java and Node are kept.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/julia* \
            /opt/az \
            /opt/microsoft \
            /opt/google/chrome \
            /usr/local/share/chromium \
            /usr/lib/google-cloud-sdk
          docker system prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v7

      # CHANGED: npm instead of yarn; this repo has package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
          # CHANGED: android/ isn't committed here, so key the Gradle cache on the JS dependencies
          # it's generated from.
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # CHANGED: android/ is not committed (Continuous Native Generation); generate it from
      # app.json + app.config.js. --platform android leaves ios/ alone.
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      # CHANGED: new step. Logs how much disk the build used and how much is left, so the margin
      # is visible in the job log (if the disk fills completely, GitHub loses the whole log).
      - name: Disk usage after build
        if: always()
        run: |
          df -h /
          du -sh android/app/build node_modules/llama.rn/android/.cxx node_modules/llama.rn/android/build ~/.gradle 2>/dev/null || true

      # CHANGED: checks llama.rn's libraries instead of wavpack/wtransport, and that the 32-bit
      # ABIs dropped in app.config.js are really gone.
      - name: Check native libraries
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'lib/.*/librnllama.*\.so'
          for abi in arm64-v8a x86_64; do
            for lib in rnllama rnllama_jni; do
              unzip -l "$APK" | grep -q "lib/$abi/lib$lib.so" || { echo "::error::lib/$abi/lib$lib.so missing from APK"; exit 1; }
            done
          done
          if unzip -l "$APK" | grep -qE 'lib/(armeabi-v7a|x86)/'; then
            echo "::error::APK contains 32-bit libraries; the ABI limit in app.config.js didn't apply"
            exit 1
          fi

      - name: Collect APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/Odysseus-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS IPA (unsigned)
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # CHANGED: npm instead of yarn; this repo has package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # llama.rn's postinstall also downloads its prebuilt rnllama.xcframework here, so unlike
      # Android, the iOS build doesn't compile llama.cpp.
      - name: Install JS dependencies
        run: npm ci

      # CHANGED: no Rust / XCFramework steps; those built the other project's WebTransport client.

      # ios/ is not committed; generate it from app.json + config plugins.
      # --platform ios leaves android/ alone.
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme '$SCHEME' from $WORKSPACE"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # CHANGED: checks llama.rn instead of the other project's audio engine: the RNLlama module
      # is linked into the app binary and the dynamic rnllama.framework (llama.cpp) is embedded.
      - name: Check llama.rn is linked
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          ls -la "$BIN"
          nm "$BIN" | awk '$NF == "_OBJC_CLASS_$_RNLlama" && $(NF-1) != "U" { found = 1 } END { exit !found }' \
            || { echo "::error::RNLlama module is not linked into $BIN"; exit 1; }
          test -d "$APP/Frameworks/rnllama.framework" \
            || { echo "::error::rnllama.framework is not embedded in $APP"; ls -la "$APP/Frameworks"; exit 1; }
          echo "found RNLlama module and rnllama.framework"

      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry "Odysseus-${VERSION}-${GITHUB_SHA::7}-unsigned.ipa" Payload
          rm -rf Payload
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    # Publish whatever succeeded; a failing iOS build shouldn't block the APK.
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="$GITHUB_REF_NAME"
            FLAGS=()
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            TITLE="Build #${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})"
            FLAGS=(--prerelease)
          fi

          # CHANGED: install notes for this app (EAS-signed copies need uninstalling first).
          cat > notes.md <<EOF
          Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}
          ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})).
          Android: **${{ needs.android.result }}**, iOS: **${{ needs.ios.result }}**.

          **Android (.apk):** open the file on the phone and allow "install unknown apps" for your browser.
          It's signed with the stock Expo debug key, so uninstall any EAS-built copy first.

          **iOS (-unsigned.ipa):** not installable as-is. Sideload it with Sideloadly or AltStore,
          which re-sign it with your Apple ID (free IDs expire after 7 days).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md "${FLAGS[@]}"
          fi
